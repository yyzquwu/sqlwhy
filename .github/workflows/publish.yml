name: Publish sqlwhy v1.0.1 to PyPI

on: workflow_dispatch

permissions: {}

concurrency:
  group: pypi-sqlwhy-v1.0.1
  cancel-in-progress: false

env:
  RELEASE_SHA256: |
    ed040dbc014f93cea5f9e2fcd1d976ad40c815a84ed2c34690e6e5cc1fddd540  sqlwhy-1.0.1-py3-none-any.whl
    6206c425760ad2a32af9b46b64be43b84c6a5f41db17a4a73dbf49556d4efa38  sqlwhy-1.0.1.tar.gz

jobs:
  verify:
    if: github.repository == 'yyzquwu/sqlwhy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.stage.outputs.artifact-id }}
    steps:
      - name: Verify the release tag and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.1
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            --jq '.object | select(.type == "commit") | .sha')
          if [[ $commit != 3fdeee5e240610169c712b854a6bd797406f314a ]]; then
            echo "::error::$tag does not point to the pinned release commit"
            exit 1
          fi

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          if [[ $release != "$tag" ]]; then
            echo "::error::$tag is not a published stable release"
            exit 1
          fi

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern SHA256SUMS.txt --pattern sqlwhy-1.0.1-py3-none-any.whl \
            --pattern sqlwhy-1.0.1.tar.gz
          cd release
          if ! printf '%s' "$RELEASE_SHA256" | cmp --silent - SHA256SUMS.txt; then
            echo "::error::The release checksum file differs from the workflow's pins"
            exit 1
          fi
          printf '%s' "$RELEASE_SHA256" | sha256sum --check --strict

      - name: Stage the verified distributions
        id: stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlwhy-v1.0.1-${{ github.run_attempt }}
          path: |
            release/sqlwhy-1.0.1-py3-none-any.whl
            release/sqlwhy-1.0.1.tar.gz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlwhy/1.0.1/
    permissions:
      id-token: write
    steps:
      - name: Retrieve the verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist

      - name: Confirm the upload directory has exactly the two pinned files
        shell: bash
        working-directory: dist
        run: |
          shopt -s dotglob nullglob
          files=(*)
          if [[ ${#files[@]} -ne 2 ]]; then
            echo '::error::Expected exactly two files in the PyPI upload directory'
            exit 1
          fi
          printf '%s' "$RELEASE_SHA256" | sha256sum --check --strict

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: false

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Run the public PyPI quickstart without a checkout
        shell: bash
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_PYTHON: "3.12"
        run: |
          python3 -m venv "$RUNNER_TEMP/launcher"
          "$RUNNER_TEMP/launcher/bin/pip" install --index-url https://pypi.org/simple uv
          export PATH="$RUNNER_TEMP/launcher/bin:$PATH"
          for attempt in 1 2 3 4; do
            if [[ $(uvx --refresh sqlwhy --version) == 'sqlwhy 1.0.1' ]]; then break; fi
            if [[ $attempt == 4 ]]; then exit 1; fi
            sleep 5
          done
          status=0
          uvx sqlwhy demo cte-audit --json > demo.json || status=$?
          [[ $status == 1 ]]
          jq -e '.violation_count == 2 and .source_keys == 2 and .report_rows == 2' demo.json
