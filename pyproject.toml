[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlwhy"
version = "1.0.0"
description = "Find missing or duplicated source keys in DuckDB reports and trace their joins and filters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Anson Huang"}]
dependencies = ["duckdb>=1.5.6,<1.6", "sqlglot>=30.33,<31"]

[project.urls]
Repository = "https://github.com/yyzquwu/sqlwhy"
Issues = "https://github.com/yyzquwu/sqlwhy/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sqlwhy = "sqlwhy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
